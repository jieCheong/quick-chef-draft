# .github/workflows/ci.yml
#
# Four independent jobs running in parallel on every push and PR.
# Added from Day 18: lint, typecheck, test.
# Added now: audit (dependency vulnerability scan).
#
# WHY A SEPARATE AUDIT JOB INSTEAD OF ADDING IT TO AN EXISTING JOB:
# Audit failures are a different category from code failures — a broken
# test means your logic is wrong, a high-severity vulnerability means
# a dependency needs updating. Keeping them separate means a vulnerable
# dependency shows up as its own named red X ("audit") in GitHub's UI,
# not hidden inside a failing "test" job where someone might miss it.

name: CI

on:
  push:
    branches: [main, rebuild/own-backend]
  pull_request:
    branches: [main, rebuild/own-backend]

jobs:
  # ── Job 1: Lint ─────────────────────────────────────────────────────────────
  lint:
    name: Lint (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # ── Job 2: Typecheck ────────────────────────────────────────────────────────
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npx tsc --noEmit

      - name: Install server dependencies
        working-directory: ./server
        run: npm ci

      - name: Typecheck server
        working-directory: ./server
        run: npx tsc --noEmit

  # ── Job 3: Test ─────────────────────────────────────────────────────────────
  test:
    name: Test (server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: ./server
        run: npm ci

      - name: Run tests
        working-directory: ./server
        run: npm test

  # ── Job 4: Security audit ───────────────────────────────────────────────────
  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── Frontend audit ──────────────────────────────────────────────────────
      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend dependencies
        # --audit-level=high means the job only FAILS on high or critical
        # severity vulnerabilities. Low and moderate are reported but don't
        # break the build — those are typically transitive dependencies with
        # no realistic exploit path and fixing them would require breaking
        # upstream changes. High/critical are the ones that actually matter
        # and are worth blocking a merge over.
        run: npm audit --audit-level=high

      # ── Server audit ────────────────────────────────────────────────────────
      - name: Install server dependencies
        working-directory: ./server
        run: npm ci

      - name: Audit server dependencies
        working-directory: ./server
        # Same threshold — high and above block the build.
        # The server audit is MORE important than the frontend audit
        # because server dependencies run with elevated privileges
        # (database access, API keys) — a vulnerable server dependency
        # has a larger blast radius than a vulnerable frontend dependency.
        run: npm audit --audit-level=high