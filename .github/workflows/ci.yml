# .github/workflows/ci.yml
#
# Runs on every push and every pull request targeting main or
# rebuild/own-backend. Three independent jobs: lint, typecheck, test.
#
# WHY SEPARATE JOBS INSTEAD OF ONE JOB RUNNING EVERYTHING SEQUENTIALLY:
# GitHub Actions runs independent jobs in PARALLEL by default, on
# separate runners. A typecheck failure and a lint failure surface as
# two distinct red X's instead of one job stopping at the first error
# and hiding whether the second check would have also failed. For a
# resume/portfolio repo, this also means the Actions tab visibly shows
# three named checks — "lint", "typecheck", "test" — which reads as
# more deliberate engineering than a single opaque "build" job.

name: CI

on:
  push:
    branches: [main, rebuild/own-backend]
  pull_request:
    branches: [main, rebuild/own-backend]

jobs:
  # ── Job 1: Lint the frontend ────────────────────────────────────────────────
  lint:
    name: Lint (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # ── Job 2: Typecheck both frontend and server ───────────────────────────────
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      # tsc --noEmit compiles without writing any .js output files —
      # we only want the type-checking side effect (pass/fail), not
      # an actual build artifact. The frontend tsconfig is already
      # configured for this; we're just invoking it directly via npx
      # rather than through a custom package.json script, since
      # "typecheck" isn't one of QuickChef's existing scripts.
      - name: Typecheck frontend
        run: npx tsc --noEmit

      - name: Install server dependencies
        working-directory: ./server
        run: npm ci

      - name: Typecheck server
        working-directory: ./server
        run: npx tsc --noEmit

  # ── Job 3: Run server test suite ────────────────────────────────────────────
  test:
    name: Test (server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          # cache-dependency-path matters here because the server has
          # its OWN package-lock.json, separate from the root one.
          # Without this, setup-node would only cache based on the
          # root lockfile and miss caching server/node_modules.
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: ./server
        run: npm ci

      # No DATABASE_URL, JWT_SECRET, or OPENAI_API_KEY needed here —
      # the entire test suite mocks pg, openai, and jsonwebtoken at
      # the module level (see Day 16/17 test files). This is precisely
      # why those tests were written to mock external dependencies:
      # CI has no database, no real OpenAI credits to spend, and no
      # production secrets, and the suite still runs end to end.
      - name: Run tests
        working-directory: ./server
        run: npm test